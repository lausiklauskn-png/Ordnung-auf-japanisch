<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>整理 · Ordnung auf Japanisch</title>
<meta name="description" content="Sprechende Begleit-App: Schritt für Schritt durch die Wohnung, bis Ordnung zur Gewohnheit wird.">
<meta name="theme-color" content="#f7f2e9">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script src="assets/thema.js?v=3"></script>
<link rel="stylesheet" href="assets/style.css?v=16">
</head>
<body>
<svg class="filter" aria-hidden="true" width="0" height="0">
  <!-- leicht ausgefranste Pinselkante für Kanji und Enso -->
  <filter id="pinsel"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.6" numOctaves="2" seed="7" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="3"/></filter>
</svg>

<header class="kopf">
  <button class="kopf-knopf zurueck-knopf" data-aktion="zurueck" id="btnZurueck" aria-label="Zurück" title="Zurück" hidden>←</button>
  <a href="#/" class="marke" aria-label="Start"><img class="marke-bild" src="icons/favicon-64.png?v=2" width="64" height="64" alt="整理" lang="ja"><span class="marke-text">Ordnung auf Japanisch</span></a>
  <button class="kopf-knopf" id="btnSprache" type="button" aria-label="Sprache wählen" aria-expanded="false" aria-controls="spracheAuswahl" title="Sprache wählen">文</button>
  <button class="kopf-knopf" id="btnThema" type="button" aria-label="Farbthema wählen" aria-expanded="false" aria-controls="themaAuswahl" title="Farbthema wählen">◐</button>
  <button class="kopf-knopf install-knopf" data-aktion="installieren" id="btnInstall" title="Als App auf dieses Gerät legen" aria-label="Als App installieren">📲<span class="lang"> Installieren</span></button>
  <button class="kopf-knopf" data-aktion="aktualisieren" id="btnNeu" aria-label="Aktualisieren — neueste Fassung laden, dein Verlauf bleibt" title="Aktualisieren (dein Verlauf bleibt)">⟳</button>
  <button class="kopf-knopf" data-aktion="stumm" id="btnStumm" aria-label="Vorlesen an oder aus" title="Vorlesen an/aus">🔊</button>
</header>
<section class="thema-auswahl" id="themaAuswahl" aria-labelledby="themaTitel" hidden>
  <h2 id="themaTitel">Farbthema</h2>
  <div class="knopfreihe" role="group" aria-label="Farbthemen">
    <button class="knopf" type="button" data-thema-wahl="washi" aria-pressed="true">Washi</button>
    <button class="knopf" type="button" data-thema-wahl="sand" aria-pressed="false">Sand</button>
    <button class="knopf" type="button" data-thema-wahl="salbei" aria-pressed="false">Salbei</button>
    <button class="knopf" type="button" data-thema-wahl="leinen" aria-pressed="false">Leinen</button>
    <button class="knopf" type="button" data-thema-wahl="morgenlicht" aria-pressed="false">Morgenlicht</button>
    <button class="knopf" type="button" data-thema-wahl="kirschbluete" aria-pressed="false">Kirschblüte</button>
    <button class="knopf" type="button" data-thema-wahl="daemmerung" aria-pressed="false">Dämmerung</button>
    <button class="knopf" type="button" data-thema-wahl="moos" aria-pressed="false">Moos</button>
  </div>
  <p>Deine Wahl bleibt beim nächsten Besuch erhalten.</p>
</section>
<section class="thema-auswahl" id="spracheAuswahl" aria-labelledby="spracheTitel" hidden>
  <h2 id="spracheTitel">Sprache</h2>
  <div class="knopfreihe" role="group" aria-label="Sprache" translate="no">
    <button class="knopf" type="button" data-sprache="de" aria-pressed="true" lang="de">Deutsch</button>
    <button class="knopf" type="button" data-sprache="en" aria-pressed="false" lang="en">English</button>
    <button class="knopf" type="button" data-sprache="ru" aria-pressed="false" lang="ru">Русский</button>
    <button class="knopf" type="button" data-sprache="ja" aria-pressed="false" lang="ja">日本語</button>
    <button class="knopf" type="button" data-sprache="es" aria-pressed="false" lang="es">Español</button>
    <button class="knopf" type="button" data-sprache="pl" aria-pressed="false" lang="pl">Polski</button>
  </div>
  <p>Alle Texte sind auch ohne Internet verfügbar.</p>
</section>
<div id="uhren" class="uhren" aria-live="polite" hidden></div>

<main id="ansicht" class="ansicht" tabindex="-1" aria-live="polite"></main>

<nav class="leiste" aria-label="Hauptmenü">
  <a href="#/" data-nav="start"><span lang="ja">家</span>Start</a>
  <a href="#/gewohnheiten" data-nav="gewohnheiten"><span lang="ja">習</span>Gewohnheit</a>
  <a href="#/kalender" data-nav="kalender"><span lang="ja">暦</span>Kalender</a>
  <a href="#/flecken" data-nav="flecken"><span lang="ja">染</span>Flecken</a>
  <a href="#/regeln" data-nav="regeln"><span lang="ja">規</span>Regeln</a>
  <a href="#/verlauf" data-nav="verlauf"><span lang="ja">歴</span>Verlauf</a>
</nav>

<div id="meldung" class="meldung" role="status" hidden></div>
<div id="pause" class="pause" role="dialog" aria-label="Pause" hidden></div>
<div id="blaetter" class="blaetter" aria-hidden="true"></div>

<script defer src="assets/inhalt.js?v=10"></script>
<script defer src="assets/sprechtext.js?v=3"></script>
<script defer src="assets/japanisch.js?v=1"></script>
<script defer src="assets/db.js?v=2"></script>
<script defer src="assets/klang.js?v=1"></script>
<script defer src="assets/absicht.js?v=2"></script>
<script defer src="assets/knopf.js?v=1"></script>
<script defer src="assets/sonnenlicht.js?v=1"></script>
<script defer src="assets/wischen.js?v=1"></script>
<script defer src="assets/sprachen.js?v=1"></script>
<script defer src="assets/sprache.js?v=1"></script>
<script defer src="assets/app.js?v=14"></script>
</body>
</html>
