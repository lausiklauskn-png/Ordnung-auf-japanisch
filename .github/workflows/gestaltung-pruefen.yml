name: Gestaltung pruefen
on:
  push:
    branches: [codex/gestaltung]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - name: Vollstaendige Proben
        run: npm test
        env:
          OJ_GESTALTUNGSBILDER: /tmp/oj-gestaltung
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gestaltung-vorschau
          path: /tmp/oj-gestaltung
          retention-days: 1
      - name: Gegenprobe fuer Themen, Bildformat und Mischwarnung
        run: |
          cp assets/thema.js /tmp/oj-thema-geprueft.js
          cp assets/style.css /tmp/oj-style-geprueft.css
          cp assets/app.js /tmp/oj-app-geprueft.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/thema.js')
          s = p.read_text()
          assert 'document.documentElement.dataset.thema = name;' in s
          p.write_text(s.replace('document.documentElement.dataset.thema = name;', "document.documentElement.dataset.thema = 'washi';"))
          p = Path('assets/app.js')
          s = p.read_text()
          assert 'return fmt(text).replace(' in s
          p.write_text(s.replace('return fmt(text).replace(', 'return fmt(text);\n    return fmt(text).replace('))
          p = Path('assets/style.css')
          s = p.read_text()
          p.write_text(s.replace('aspect-ratio: 3 / 2', 'aspect-ratio: 3 / 1', 1))
          PY
          if node tests/gestaltung.mjs > /tmp/oj-gegenprobe.log 2>&1; then
            echo 'ROT: Gegenprobe blieb unerwartet gruen'
            exit 1
          fi
          cp /tmp/oj-thema-geprueft.js assets/thema.js
          cp /tmp/oj-style-geprueft.css assets/style.css
          cp /tmp/oj-app-geprueft.js assets/app.js
          cat /tmp/oj-gegenprobe.log
          grep -q 'ROT: Thema sand:' /tmp/oj-gegenprobe.log
          grep -q 'ROT: Pinselbild:' /tmp/oj-gegenprobe.log
          grep -q 'ROT: Nie mischen:' /tmp/oj-gegenprobe.log
