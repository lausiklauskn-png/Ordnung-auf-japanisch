name: Bilder 20 prüfen
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install chromium
      - run: node tests/uhr.mjs
      - run: npm test
      - name: Gegenprobe ohne Bildliste
        shell: bash
        run: |
          cp assets/inhalt.js /tmp/inhalt-original.js
          trap 'cp /tmp/inhalt-original.js assets/inhalt.js' EXIT
          printf '\nwindow.OJ_INHALT.bilder = [];\n' >> assets/inhalt.js
          set +e
          node tests/bildserie.mjs > /tmp/gegenprobe.log 2>&1
          rc=$?
          set -e
          cat /tmp/gegenprobe.log
          test "$rc" -ne 0
          for id in s2.3 s2.4 s2.5 s2.6 s2.7 s2.8 s2.9 s2.10 s2.11 s2.12 s2.13 st3 s3.1 s3.2 s3.3 s3.4 s3.5 s3.6 s3.7 s3.8
          do
            grep -F "ROT: Bildserie: $id " /tmp/gegenprobe.log
          done
