name: Offline-Sprachen pruefen
on:
  push:
    branches: [codex/offline-sprachen]
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: node tools/sprachen-bauen.mjs
      - run: npx playwright-core install --with-deps chromium
      - name: Vollstaendige Proben mit sechs Offline-Sprachen
        run: npm test
      - name: Gegenprobe unvollstaendige Sprachdatei
        run: |
          cp assets/sprachen.js /tmp/oj-sprachen.js
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import vm from 'node:vm';
          const c={window:{}};
          vm.runInNewContext(fs.readFileSync('assets/sprachen.js','utf8'),c);
          vm.runInNewContext(fs.readFileSync('assets/inhalt.js','utf8'),c);
          const d=c.window.OJ_SPRACHEN, q=c.window.OJ_INHALT.stationen[2].schritte[0].text;
          d.sprachen.en[d.quellen.indexOf(q)]='';
          fs.writeFileSync('assets/sprachen.js','window.OJ_SPRACHEN='+JSON.stringify(d)+';');
          JS
          if OJ_NUR_SPRACHDATEN=1 node tests/sprachen.mjs > /tmp/oj-sprachdaten.log 2>&1; then exit 1; fi
          cp /tmp/oj-sprachen.js assets/sprachen.js
          cat /tmp/oj-sprachdaten.log
          grep -q 'ROT: Sprachdatei en: alle Katalogtexte vollständig' /tmp/oj-sprachdaten.log
      - name: Gegenprobe Oberflaeche und Vorlesesprache
        run: |
          cp assets/sprache.js /tmp/oj-sprache.js
          echo "window.OJ.Sprache.html = s => s; window.OJ.Sprache.locale = 'de-DE';" >> assets/sprache.js
          if node tests/sprachen.mjs > /tmp/oj-sprachwahl.log 2>&1; then exit 1; fi
          cp /tmp/oj-sprache.js assets/sprache.js
          cat /tmp/oj-sprachwahl.log
          grep -q 'ROT: Sprache en: Anleitung mit passender Stimme' /tmp/oj-sprachwahl.log
          grep -q 'ROT: Sprache en: zentrale Ansichten ohne deutsche Resttexte' /tmp/oj-sprachwahl.log
      - name: Gepruefte erzeugte Sprachdatei und Abhaengigkeiten sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprachen.js package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Gepruefte Offline-Sprachdatei und npm-Sperrdatei sichern"
            git push origin HEAD:codex/offline-sprachen
          fi
