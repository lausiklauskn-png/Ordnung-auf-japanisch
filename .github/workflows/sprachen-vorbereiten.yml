name: Offline-Sprachen vorbereiten
on:
  push:
    branches: [codex/sprachen-vorbereiten]
permissions:
  contents: write
jobs:
  uebersetzen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Erstuebersetzungen speichern
        run: python3 tools/uebersetzungen-holen.py
      - name: Nur Sprachdateien in Arbeitszweig sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uebersetzungen/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Offline-Erstuebersetzungen in fuenf Zielsprachen vorbereiten"
            git push origin HEAD:codex/sprachen-vorbereiten
          fi
