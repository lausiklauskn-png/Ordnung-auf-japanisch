name: Offline-Sprachen vorbereiten
on:
  push:
    branches: [codex/sprachen-vorbereiten]
permissions:
  contents: write
jobs:
  uebersetzen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Erstuebersetzungen speichern
        run: python3 tools/uebersetzungen-holen.py
      - name: Nur Sprachdateien in Arbeitszweig sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uebersetzungen/en.json docs/uebersetzungen/ru.json docs/uebersetzungen/ja.json docs/uebersetzungen/es.json docs/uebersetzungen/pl.json
          git commit -m "Offline-Erstuebersetzungen in fuenf Zielsprachen vorbereiten"
          git push origin HEAD:codex/sprachen-vorbereiten
