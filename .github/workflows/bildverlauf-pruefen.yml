name: Bildverlauf pruefen
on:
  push:
    branches: [codex/bildverlauf]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - name: Vollstaendige Proben
        run: npm test
      - name: Gegenprobe fuer harten Bildrand
        run: |
          cp assets/style.css /tmp/oj-verlauf-geprueft.css
          cat >> assets/style.css <<'CSS'
          .kbild { margin-bottom: 0; }
          .kbild::after { background: none; }
          CSS
          if node tests/gestaltung.mjs > /tmp/oj-verlauf-gegenprobe.log 2>&1; then
            echo 'ROT: Gegenprobe blieb unerwartet gruen'
            exit 1
          fi
          cp /tmp/oj-verlauf-geprueft.css assets/style.css
          cat /tmp/oj-verlauf-gegenprobe.log
          grep -q 'ROT: Pinselbild: dunkler Text im Bild mit weichem Verlauf' /tmp/oj-verlauf-gegenprobe.log
