name: Bildserie pruefen
on:
  push:
    branches: [codex/bilder-grundlagen]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install chromium
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
      - name: Bildserie vor Gegenprobe
        run: node tests/bildserie.mjs
      - name: Gegenprobe fehlende Bildverknuepfungen
        run: |
          cp assets/inhalt.js /tmp/oj-bildserie-inhalt.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('assets/inhalt.js')
          # Ausschließlich die Bildliste entfernen; alle Tipps bleiben vollständig.
          s, n = re.subn(r'("bilder":\\s*)\\[[^\\]]*\\]', r'\\1[]', p.read_text(), count=1)
          assert n == 1
          p.write_text(s)
          PY
          node --check assets/inhalt.js
          if node tests/bildserie.mjs > /tmp/oj-bildserie.log 2>&1; then exit 1; fi
          cp /tmp/oj-bildserie-inhalt.js assets/inhalt.js
          cat /tmp/oj-bildserie.log
          grep -q 'ROT: Bildserie: st0 im zugehörigen Raumkopf' /tmp/oj-bildserie.log
          grep -q 'ROT: Bildserie: s0.1 bei seinem Text' /tmp/oj-bildserie.log
