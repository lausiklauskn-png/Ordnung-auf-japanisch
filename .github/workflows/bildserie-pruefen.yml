name: Bildserie pruefen
on:
  push:
    branches: [codex/bilder]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bilder
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - name: Bildserie pruefen
        run: npm test
      - name: Gegenprobe fuer fehlende Seitenbilder
        run: |
          cp assets/app.js /tmp/oj-app-geprueft.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/app.js')
          s = p.read_text()
          assert 'const seitenKopf = (id, text) => hatBild(id)' in s
          p.write_text(s.replace('const seitenKopf = (id, text) => hatBild(id)', 'const seitenKopf = (id, text) => false'))
          PY
          if node tests/speicher.mjs > /tmp/oj-gegenprobe.log 2>&1; then
            cp /tmp/oj-app-geprueft.js assets/app.js
            echo "ROT: Gegenprobe blieb unerwartet gruen"
            exit 1
          fi
          cp /tmp/oj-app-geprueft.js assets/app.js
          cat /tmp/oj-gegenprobe.log
          grep -q 'ROT: Sonderseite gewohnheiten: zugeordnetes Bild' /tmp/oj-gegenprobe.log
