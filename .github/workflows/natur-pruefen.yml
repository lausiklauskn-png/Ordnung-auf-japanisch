name: Naturgestaltung pruefen
on:
  push:
    branches: [codex/natur-hintergruende]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - name: Vollstaendige Proben
        run: npm test
      - name: Gegenprobe Navigation und Material
        run: |
          cp assets/style.css /tmp/oj-natur.css
          cat >> assets/style.css <<'CSS'
          .leiste a[aria-current="page"] { font-weight: 400; background: none; }
          .leiste a[aria-current="page"]::before { display: none; height: 0; }
          :root { --papier-muster: none !important; --papier-licht: none !important; }
          CSS
          if node tests/gestaltung.mjs > /tmp/oj-natur.log 2>&1; then exit 1; fi
          cp /tmp/oj-natur.css assets/style.css
          cat /tmp/oj-natur.log
          grep -q 'ROT: Navigation start:' /tmp/oj-natur.log
          grep -q 'ROT: Material washi:' /tmp/oj-natur.log
      - name: Gegenprobe Uhrflaeche
        run: |
          cp assets/style.css /tmp/oj-natur.css
          echo '.uhren { background: rgba(240,230,210,.9); width: 100%; }' >> assets/style.css
          if node tests/uhr.mjs > /tmp/oj-uhr.log 2>&1; then exit 1; fi
          cp /tmp/oj-natur.css assets/style.css
          cat /tmp/oj-uhr.log
          grep -q 'ROT: Uhr beim Scrollen:' /tmp/oj-uhr.log
      - name: Gegenprobe Family-Glas
        run: |
          cp assets/knopf.js /tmp/oj-knopf.js
          echo '/* Absichtlich ohne Mausverhalten. */' > assets/knopf.js
          if node tests/gestaltung.mjs > /tmp/oj-knopf.log 2>&1; then exit 1; fi
          cp /tmp/oj-knopf.js assets/knopf.js
          cat /tmp/oj-knopf.log
          grep -q 'ROT: Family-Glas: Schimmer und 3D-Neigung folgen der Maus' /tmp/oj-knopf.log
