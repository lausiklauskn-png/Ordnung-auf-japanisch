name: Bilder 20 prüfen
on:
  push:
    branches: [codex/bilder-20-schlafzimmer-wohnen-boeden]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: Bild-Gegenprobe
        if: contains(github.event.head_commit.message, '88 von 148')
        run: |
          cp assets/inhalt.js /tmp/inhalt.js
          echo 'window.OJ_INHALT.bilder = [];' >> assets/inhalt.js
          set +e
          node tests/bildserie.mjs > /tmp/gegenprobe.log 2>&1
          status=$?
          set -e
          cp /tmp/inhalt.js assets/inhalt.js
          cat /tmp/gegenprobe.log
          test "$status" -ne 0
          python3 - <<'PY'
          import pathlib
          log=pathlib.Path('/tmp/gegenprobe.log').read_text()
          ids=['s5.'+str(i) for i in range(6,11)]+['st6']+['s6.'+str(i) for i in range(1,12)]+['st7','s7.1','s7.2']
          for id in ids:
              assert any('ROT:' in l and id+' ' in l for l in log.splitlines()), id
          print('Alle 20 neuen Kennungen reagieren rot.')
          PY
